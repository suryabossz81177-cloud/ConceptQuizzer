<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Quiz</title>
<link rel="stylesheet" href="css/quiz-play.css">

<style>
.quizPageShell{width:100%;display:flex;justify-content:center;align-items:center;padding-top:58px}
.quizTopNav{
  position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:20;
  width:min(700px,calc(100% - 24px));display:flex;justify-content:flex-end;gap:7px
}
.quizTopNav a{
  color:white;text-decoration:none;font-weight:700;font-size:12px;
  padding:8px 10px;border-radius:11px;background:rgba(255,255,255,.13);
  border:1px solid rgba(255,255,255,.16);backdrop-filter:blur(10px)
}
@media(max-width:500px){.quizTopNav{justify-content:center}.quizPageShell{padding-top:66px}}
</style>
</head>
<body>
<div class="quizTopNav">
  <a href="quiz.html">← Levels</a>
  <a href="dashboard.html">📊 Dashboard</a>
  <a href="achievements.html">🏆 Achievements</a>
</div>
<div class="quizPageShell">
<div class="quizBox">
  <div class="topBar">
    <div id="questionNumber">Question 1 / 10</div>
    <div id="timer">05:00</div>
  </div>
  <h2 id="question">Loading...</h2>
  <div id="options"></div>
  <button id="nextBtn">Next →</button>
  <div id="resultScreen" style="display:none;">
    <div class="resultCard">
      <div class="resultIcon">🎉</div>
      <h1 id="resultTitle">Quiz Complete!</h1>
      <p id="resultMessage">Great job!</p>
      <div class="resultStats">
        <div><strong id="resultScore">0/10</strong><span>Score</span></div>
        <div><strong id="resultPercentage">0%</strong><span>Percentage</span></div>
        <div><strong id="resultXP">+0 XP</strong><span>XP Earned</span></div>
      </div>
      <button id="resultButton">Continue →</button>
    </div>
  </div>
</div>
</div>
<script src="js/quizDatabase.js?v=FINAL3"></script>
  <script src="js/quiz-registry.js?v=1"></script>
<script src="js/quiz-play.js?v=FINAL3"></script>
</body>
</html>
