<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>

Concept Quizzer • Notes

</title>

<link
rel="preconnect"
href="https://fonts.googleapis.com">

<link
rel="preconnect"
href="https://fonts.gstatic.com"
crossorigin>

<link
href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
rel="stylesheet">

<link
href="https://fonts.googleapis.com/icon?family=Material+Icons+Round"
rel="stylesheet">

<link
rel="stylesheet"
href="css/notes.css">


<style>
.readerCard,.aiCard{
  background:#fff;border-radius:28px;padding:24px;margin:24px 0;
  box-shadow:0 10px 30px rgba(40,45,100,.08)
}
.readerCard h2,.aiCard h2{margin-top:0;color:#4f46d9}
.readerControls{display:flex;flex-wrap:wrap;gap:10px}
.readerControls button,.aiCard button{
  border:0;border-radius:16px;padding:12px 18px;
  font:inherit;font-weight:700;cursor:pointer;
  background:#5b4bea;color:#fff
}
.aiCard textarea{
  width:100%;box-sizing:border-box;resize:vertical;
  border:1px solid #ddd;border-radius:16px;padding:14px;
  font:inherit;margin:10px 0 12px
}
.aiCard .answerBox{
  margin-top:16px;padding:16px;border-radius:18px;background:#f6f5ff
}
</style>

</head>

<body>

<header
class="topBar">

<button
id="backButton"
class="iconButton">

<span
class="material-icons-round">

arrow_back

</span>

</button>

<div
class="titleArea">

<h2
id="chapterTitle">

Chapter Title

</h2>

<p
id="chapterPath">

Class • Subject

</p>

</div>

<button
id="bookmarkButton"
class="iconButton">

<span
class="material-icons-round">

bookmark_border

</span>

</button>

  <button id="themeToggle" class="themeBtn">🌙</button>
  
</header>

<main
class="notesContainer">

<section
class="heroCard">

<span
class="chapterBadge">

📘 Chapter Notes

</span>

<h1
id="notesHeading">

Loading...

</h1>

<p
id="notesDescription">

Easy-to-understand notes with important concepts and key points.

</p>
  
  <div class="progressCard">

  <div class="progressInfo">
    <span>Chapter Progress</span>
    <span id="progressText">0%</span>
  </div>

  <div class="progressBar">
    <div id="progressFill"></div>
  </div>

  </div>

</section>

  <div class="searchBox">
    <input
        type="text"
        id="chapterSearch"
        placeholder="🔍 Search in this chapter..."
    />
  </div>

<section
id="notesContent"
class="notesContent">

<!-- Notes will be loaded here by notes.js -->

</section>

  <section
class="importantBox">

<h2>

Important Points

</h2>

<ul
id="importantPoints">

<!-- Generated by notes.js -->

</ul>

</section>

<section
class="keyTerms">

<h2>

Key Terms

</h2>

<div
id="keyTermsContainer">

<!-- Generated by notes.js -->

</div>

</section>

<section
class="summaryCard">

<h2>

Chapter Summary

</h2>

<p
id="chapterSummary">

Summary will appear here.

</p>

</section>

<div
class="navigationButtons">

<button
id="previousChapter"
class="navButton">

<span
class="material-icons-round">

arrow_back

</span>

Previous

</button>

<button
id="nextChapter"
class="navButton">

Next

<span
class="material-icons-round">

arrow_forward

</span>

</button>

</div>

</main>

<!-- FIXED NOTES SYSTEM -->
<script src="js/chapter-registry.js"></script>
<script src="js/chapter-resolver.js"></script>
<script src="js/notes.js"></script>
</body>

</html>
